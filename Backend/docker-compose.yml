services:
  db:
    image: postgis/postgis:16-3.4
    container_name: disaster_relief_db
    environment:
      POSTGRES_DB: disaster_relief
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: